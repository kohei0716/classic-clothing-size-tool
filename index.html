<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Classic clothing サイズ診断</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f6f4;
    --ink: #111111;
    --sub: #6b6b6b;
    --accent: #111111;
    --accent-ink: #ffffff;
    --border: #dcdcd8;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Helvetica Neue", sans-serif;
    padding: 24px 16px 40px;
  }
  .wrap { width: 100%; max-width: 460px; margin: 0 auto; }
  .condensed { font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif; }
  .eyebrow {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    color: var(--sub);
    text-transform: uppercase;
  }
  h1 { font-size: 1.35rem; margin: 6px 0 4px; letter-spacing: 0.02em; text-wrap: balance; }
  .subtitle { font-size: 0.82rem; color: var(--sub); margin-bottom: 18px; line-height: 1.6; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .tab {
    flex: 1;
    margin: 0;
    padding: 12px 4px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: var(--sub);
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  label { display: block; font-size: 0.85rem; color: var(--sub); margin-bottom: 6px; margin-top: 20px; }
  input[type="number"], select {
    width: 100%;
    padding: 12px;
    font-size: 16px; /* iOSの自動ズーム防止 */
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--ink);
  }
  input[type="number"].invalid { border-color: var(--error); }
  input[type="number"]:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .error { display: none; margin-top: 12px; font-size: 0.85rem; color: var(--error); }
  .error.show { display: block; }
  .go {
    margin-top: 24px;
    width: 100%;
    padding: 15px;
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .go:active { opacity: 0.85; }
  .hidden, .spec-table.hidden { display: none; }

  .result {
    margin-top: 28px;
    padding: 22px;
    border-radius: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    display: none;
  }
  .result.show { display: flex; flex-direction: column; gap: 8px; animation: fadein 0.25s ease-out; }
  @media (prefers-reduced-motion: reduce) { .result.show { animation: none; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .result .label {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: var(--sub);
  }
  .result .main-size {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-size: 3.4rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .note { font-size: 0.88rem; line-height: 1.7; }
  .note.alt { color: var(--sub); }
  .spec-table {
    margin-top: 4px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    row-gap: 4px;
    font-size: 0.85rem;
  }
  .spec-table .k { color: var(--sub); }
  .spec-table .v { text-align: right; font-variant-numeric: tabular-nums; }
  .diagram { margin-top: 4px; border-top: 1px solid var(--border); padding-top: 12px; }
  .diagram .cap { font-size: 0.72rem; letter-spacing: 0.12em; color: var(--sub); margin-bottom: 8px; }
  .diagram svg { display: block; width: 100%; max-width: 240px; height: auto; margin: 0 auto; }
  .diagram .g { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
  .diagram .d { fill: none; stroke: var(--ink); stroke-width: 1; }
  .diagram .m { fill: none; stroke: #c0392b; stroke-width: 1.4; stroke-dasharray: 4 3; }
  .diagram .t { font-size: 11px; font-weight: 700; fill: #c0392b; text-anchor: middle;
                paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .fit-chips { display: none; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .chip {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
  }
  .chip-primary { border-color: var(--ink); background: var(--ink); }
  .chip-label { font-size: 0.74rem; color: var(--sub); letter-spacing: 0.03em; }
  .chip-size {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-weight: 800;
    font-size: 0.92rem;
  }
  .chip-primary .chip-label { color: #cfcfcf; }
  .chip-primary .chip-size { color: var(--accent-ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Classic clothing — Size Guide</div>
  <h1>サイズ診断</h1>
  <div class="subtitle">アイテムを選んで、おすすめのサイズをご案内します。</div>

  <div class="tabs" role="tablist" aria-label="アイテム">
    <button class="tab" role="tab" id="tab-tee" data-type="tee" aria-selected="true">Tシャツ</button>
    <button class="tab" role="tab" id="tab-bottoms" data-type="bottoms" aria-selected="false">ボトムス</button>
    <button class="tab" role="tab" id="tab-outer" data-type="outer" aria-selected="false">アウター</button>
  </div>

  <div id="bodyFields">
    <label for="height">身長(cm)</label>
    <input type="number" id="height" inputmode="decimal" placeholder="例: 172">

    <label for="weight">体重(kg)</label>
    <input type="number" id="weight" inputmode="decimal" placeholder="例: 65">
  </div>

  <div id="waistFields" class="hidden">
    <label for="waist">ウエスト実寸(cm)</label>
    <input type="number" id="waist" inputmode="decimal" placeholder="例: 80">
  </div>

  <label for="usual" id="usualLabel">普段Tシャツで着ているサイズ(任意)</label>
  <select id="usual">
    <option value="">わからない・回答しない</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
    <option value="XXL">XXL</option>
  </select>

  <div class="error" id="error" role="alert"></div>

  <button class="go" id="go">診断する</button>

  <div class="result" id="result" aria-live="polite">
    <div class="label" id="resultLabel"></div>
    <div class="main-size" id="mainSize"></div>
    <div class="note" id="note"></div>
    <div class="note alt" id="altNote"></div>
    <div class="fit-chips" id="fitChips"></div>
    <div class="spec-table hidden" id="specTable"></div>
    <div class="diagram" id="diagram"></div>
  </div>
</div>

<script>
  const SIZE_ORDER = ["S", "M", "L", "XL", "XXL"];

  // Tシャツとアウターは同じ体重ベースのサイズ表(社内サイズ表に基づく)
  const WEIGHT_CHART = [
    { size: "S",   weightMax: 58, heightMax: 170 },
    { size: "M",   weightMax: 66, heightMax: 175 },
    { size: "L",   weightMax: 74, heightMax: 180 },
    { size: "XL",  weightMax: 82, heightMax: 185 },
    { size: "XXL", weightMax: Infinity, heightMax: 195 }
  ];

  // ボトムスは社内サイズ表に基づく実寸(単位cm)。waistMin/waistMaxは隣接サイズと重なりがある
  const BOTTOMS_CHART = [
    { size: "S",   waistMin: 71, waistMax: 81, totalLength: 98,    hip: 104, inseam: 71.5 },
    { size: "M",   waistMin: 75, waistMax: 85, totalLength: 101.5, hip: 108, inseam: 74 },
    { size: "L",   waistMin: 79, waistMax: 89, totalLength: 105,   hip: 112, inseam: 76.5 },
    { size: "XL",  waistMin: 83, waistMax: 93, totalLength: 108.5, hip: 116, inseam: 79 },
    { size: "XXL", waistMin: 87, waistMax: 97, totalLength: 112,   hip: 120, inseam: 81.5 }
  ];

  const TYPES = {
    tee:     { kind: "body",  usualLabel: "普段Tシャツで着ているサイズ(任意)",       resultLabel: "おすすめサイズ(体重ベース)" },
    bottoms: { kind: "waist", usualLabel: "普段穿いているボトムスのサイズ(任意)",     resultLabel: "おすすめサイズ(ウエスト実寸ベース)" },
    outer:   { kind: "body",  usualLabel: "普段アウターで着ているサイズ(任意)",       resultLabel: "おすすめサイズ(体重ベース)" }
  };

  // 採寸位置のイラスト(目安の図。数値は入れない)
  const MARKER = `<defs><marker id="tick" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M3 0V6" stroke="#c0392b" stroke-width="1.4"/></marker></defs>`;
  const M = `marker-start="url(#tick)" marker-end="url(#tick)"`;
  const DIAGRAMS = {
    tee: `<svg viewBox="0 0 240 200" role="img" aria-label="Tシャツの採寸位置:着丈・身幅・肩幅・袖丈">${MARKER}
      <g transform="translate(20 0)">
        <path class="g" d="M70 34 L100 42 L130 34 L170 56 L152 86 L138 78 L138 172 L62 172 L62 78 L48 86 L30 56 Z"/>
        <path class="d" d="M86 36 Q100 52 114 36"/>
        <path class="m" d="M100 44 V172" ${M}/><text class="t" x="100" y="146">着丈</text>
        <path class="m" d="M62 112 H138" ${M}/><text class="t" x="100" y="106">身幅</text>
        <path class="m" d="M70 24 H130" ${M}/><text class="t" x="100" y="18">肩幅</text>
        <path class="m" d="M136 30 L176 52" ${M}/><text class="t" x="172" y="42">袖丈</text>
      </g></svg>`,
    outer: `<svg viewBox="0 0 240 200" role="img" aria-label="アウターの採寸位置:着丈・身幅・肩幅・袖丈">${MARKER}
      <g transform="translate(20 0)">
        <path class="g" d="M68 32 L100 40 L132 32 L172 54 L166 156 L148 156 L142 86 L142 174 L58 174 L58 86 L52 156 L34 156 L28 54 Z"/>
        <path class="d" d="M84 34 L100 60 L116 34 M100 60 V174"/>
        <path class="m" d="M122 42 V174" ${M}/><text class="t" x="122" y="150">着丈</text>
        <path class="m" d="M58 112 H142" ${M}/><text class="t" x="100" y="106">身幅</text>
        <path class="m" d="M68 24 H132" ${M}/><text class="t" x="100" y="18">肩幅</text>
        <path class="m" d="M138 28 L178 50 L172 156" ${M}/><text class="t" x="186" y="104">袖丈</text>
      </g></svg>`,
    bottoms: `<svg viewBox="0 0 240 200" role="img" aria-label="ボトムスの採寸位置:ウエスト・ヒップ・総丈・股下">${MARKER}
      <g transform="translate(20 0)">
        <path class="g" d="M62 30 L138 30 L146 184 L108 184 L100 76 L92 184 L54 184 Z"/>
        <path class="m" d="M62 22 H138" ${M}/><text class="t" x="100" y="14">ウエスト</text>
        <path class="m" d="M60 62 H140" ${M}/><text class="t" x="100" y="56">ヒップ</text>
        <path class="m" d="M160 30 V184" ${M}/><text class="t" x="176" y="110">総丈</text>
        <path class="m" d="M80 82 V184" ${M}/><text class="t" x="80" y="140">股下</text>
      </g></svg>`
  };

  let currentType = "tee";

  const $ = id => document.getElementById(id);

  function sizeByWeight(weight) {
    for (const row of WEIGHT_CHART) {
      if (weight <= row.weightMax) return row;
    }
    return WEIGHT_CHART[WEIGHT_CHART.length - 1];
  }

  function nextSize(size) {
    return SIZE_ORDER[Math.min(SIZE_ORDER.indexOf(size) + 1, SIZE_ORDER.length - 1)];
  }

  // 範囲外(Sより下・XXLより上)は null を返す
  function neighborSize(size, delta) {
    const idx = SIZE_ORDER.indexOf(size) + delta;
    return idx >= 0 && idx < SIZE_ORDER.length ? SIZE_ORDER[idx] : null;
  }

  // ウエスト帯は隣接サイズと重なるため、中心値に最も近いサイズを標準推奨とする
  function sizeByWaist(waist) {
    let best = BOTTOMS_CHART[0];
    let bestDiff = Infinity;
    for (const row of BOTTOMS_CHART) {
      const diff = Math.abs(waist - (row.waistMin + row.waistMax) / 2);
      if (diff < bestDiff) { bestDiff = diff; best = row; }
    }
    return best;
  }

  function showError(msg, invalidIds) {
    $("error").textContent = msg;
    $("error").classList.add("show");
    invalidIds.forEach(id => $(id).classList.add("invalid"));
    $("result").classList.remove("show");
  }

  function clearError() {
    $("error").classList.remove("show");
    ["height", "weight", "waist"].forEach(id => $(id).classList.remove("invalid"));
  }

  function setType(type) {
    currentType = type;
    const cfg = TYPES[type];
    document.querySelectorAll(".tab").forEach(t =>
      t.setAttribute("aria-selected", String(t.dataset.type === type)));
    $("bodyFields").classList.toggle("hidden", cfg.kind !== "body");
    $("waistFields").classList.toggle("hidden", cfg.kind !== "waist");
    $("usualLabel").textContent = cfg.usualLabel;
    $("usual").value = "";
    clearError();
    $("result").classList.remove("show");
  }

  // 診断結果(共通部分)を描画する
  function render({ primary, note, usual, spec }) {
    $("resultLabel").textContent = TYPES[currentType].resultLabel;
    $("mainSize").textContent = primary;
    $("note").textContent = note;

    const fitChips = $("fitChips");
    fitChips.innerHTML = "";
    fitChips.style.display = "none";
    let altNote = "";

    if (usual) {
      if (usual === primary) {
        altNote = `普段 ${usual} を着用とのことで、判定と一致しています。`;
      } else {
        altNote = `普段 ${usual} を着用とのことで、当店の推奨(${primary})とは異なります。着方の好みに合わせて選べます。`;
        const tight = neighborSize(primary, -1);
        const over = neighborSize(primary, 1);
        const chips = [{ label: "スタンダード", size: primary, current: true }];
        if (tight) chips.push({ label: "タイト", size: tight });
        if (over) chips.push({ label: "オーバーサイズ", size: over });
        chips.forEach(c => {
          const el = document.createElement("div");
          el.className = "chip" + (c.current ? " chip-primary" : "");
          el.innerHTML = `<span class="chip-label">${c.label}</span><span class="chip-size">${c.size}</span>`;
          fitChips.appendChild(el);
        });
        fitChips.style.display = "flex";
      }
    }
    $("altNote").textContent = altNote;

    const specEl = $("specTable");
    if (spec) {
      specEl.innerHTML = spec.map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join("");
      specEl.classList.remove("hidden");
    } else {
      specEl.innerHTML = "";
      specEl.classList.add("hidden");
    }
    $("diagram").innerHTML = `<div class="cap">採寸位置の目安</div>${DIAGRAMS[currentType]}`;
    $("result").classList.add("show");
  }

  function recommend() {
    clearError();
    const usual = $("usual").value;

    if (TYPES[currentType].kind === "waist") {
      const waist = parseFloat($("waist").value);
      if (!waist) { showError("ウエスト実寸を入力してください。", ["waist"]); return; }
      const row = sizeByWaist(waist);
      const inRange = waist >= row.waistMin && waist <= row.waistMax;
      const note = inRange
        ? `ウエスト実寸(${waist}cm)は ${row.size} の目安範囲(${row.waistMin}〜${row.waistMax}cm)内です。`
        : `ウエスト実寸(${waist}cm)は ${row.size} の目安範囲(${row.waistMin}〜${row.waistMax}cm)からやや外れていますが、最も近いサイズとして ${row.size} を推奨します。`;
      render({
        primary: row.size, note, usual,
        spec: [["総丈", `${row.totalLength}cm`], ["ヒップ", `${row.hip}cm`], ["股下", `${row.inseam}cm`]]
      });
      return;
    }

    const height = parseFloat($("height").value);
    const weight = parseFloat($("weight").value);
    const missing = [];
    if (!height) missing.push("height");
    if (!weight) missing.push("weight");
    if (missing.length) { showError("身長と体重を入力してください。", missing); return; }

    const row = sizeByWeight(weight);
    const primary = row.size;
    const altSize = height > row.heightMax ? nextSize(primary) : null;
    const note = (altSize && altSize !== primary)
      ? `体重(${weight}kg)からは ${primary} が基準ですが、身長(${height}cm)が ${primary} の目安上限(${row.heightMax}cm)を超えています。着丈にゆとりが欲しい場合は ${altSize} も候補です。`
      : `体重・身長ともに ${primary} の範囲内です。`;
    render({ primary, note, usual, spec: null });
  }

  document.querySelectorAll(".tab").forEach(t =>
    t.addEventListener("click", () => setType(t.dataset.type)));
  $("go").addEventListener("click", recommend);

  // 旧URLからの転送(?type=bottoms など)に対応
  const initial = new URLSearchParams(location.search).get("type");
  if (initial && TYPES[initial]) setType(initial);
</script>
</body>
</html>
