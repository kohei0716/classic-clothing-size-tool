<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Classic clothing サイズ診断(ボトムス / プロトタイプ)</title>
<style>
  :root {
    --bg: #e9e2d0;
    --panel: #f7f2e6;
    --ink: #2a2119;
    --sub: #766a55;
    --accent: #9a2b21;
    --accent-ink: #f7f2e6;
    --denim: #3c4c5c;
    --border: #c9bb98;
    --stitch: #b7a87f;
  }
  :root[data-theme="dark"] {
    --bg: #171310;
    --panel: #211b15;
    --ink: #ece2cd;
    --sub: #a2937a;
    --accent: #d9754f;
    --accent-ink: #171310;
    --denim: #7d97ac;
    --border: #443a2c;
    --stitch: #4c4230;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171310;
      --panel: #211b15;
      --ink: #ece2cd;
      --sub: #a2937a;
      --accent: #d9754f;
      --accent-ink: #171310;
      --denim: #7d97ac;
      --border: #443a2c;
      --stitch: #4c4230;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% -10%, color-mix(in srgb, var(--denim) 10%, transparent), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 56px 16px;
  }
  .tag {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px 16px 4px 4px;
    padding: 34px 30px 30px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .tag::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed var(--stitch);
    border-radius: 2px 12px 2px 2px;
    pointer-events: none;
  }
  .punch {
    position: absolute;
    top: -13px;
    left: 30px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--border);
  }
  .eyebrow {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    color: var(--denim);
    text-transform: uppercase;
  }
  h1 {
    font-size: 1.4rem;
    margin: 6px 0 2px;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .subtitle {
    font-size: 0.78rem;
    color: var(--sub);
    margin-bottom: 26px;
  }
  label {
    display: block;
    font-size: 0.82rem;
    color: var(--sub);
    margin-bottom: 6px;
    margin-top: 20px;
  }
  input[type="number"], select {
    width: 100%;
    padding: 11px 12px;
    font-size: 1rem;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--ink);
  }
  input[type="number"]:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--denim);
    outline-offset: 2px;
  }
  button {
    margin-top: 28px;
    width: 100%;
    padding: 14px;
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  button:active { filter: brightness(0.92); }
  .result {
    margin-top: 26px;
    padding: 22px;
    border-radius: 5px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: none;
  }
  .result.show {
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: stamp 0.28s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .result.show { animation: none; }
  }
  @keyframes stamp {
    from { opacity: 0; transform: scale(0.97) rotate(-1deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  .result .label {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--sub);
  }
  .result .main-size {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--accent);
    line-height: 1;
  }
  .note {
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--ink);
  }
  .note.alt { color: var(--sub); }
  .spec-table {
    margin-top: 4px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    row-gap: 4px;
    font-size: 0.82rem;
  }
  .spec-table .k { color: var(--sub); }
  .spec-table .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .fit-chips {
    display: none;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .chip {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
  }
  .chip-primary {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--panel));
  }
  .chip-label {
    font-size: 0.72rem;
    color: var(--sub);
    letter-spacing: 0.03em;
  }
  .chip-size {
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Yu Gothic", sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .chip-primary .chip-size { color: var(--accent); }
</style>
</head>
<body>
<div class="tag">
  <div class="punch"></div>
  <div class="eyebrow">Classic clothing — Bottoms / Size Guide</div>
  <h1>サイズ診断(ボトムス)</h1>
  <div class="subtitle">プロトタイプ・検証用(サーバー不要)</div>

  <label for="waist">ウエスト実寸(cm)</label>
  <input type="number" id="waist" placeholder="例: 80">

  <label for="usual">普段穿いているボトムスのサイズ(任意)</label>
  <select id="usual">
    <option value="">わからない・回答しない</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
    <option value="XXL">XXL</option>
  </select>

  <button onclick="recommend()">診断する</button>

  <div class="result" id="result">
    <div class="label">おすすめサイズ(ウエスト実寸ベース)</div>
    <div class="main-size" id="mainSize"></div>
    <div class="note" id="note"></div>
    <div class="note alt" id="altNote"></div>
    <div class="fit-chips" id="fitChips"></div>
    <div class="spec-table" id="specTable"></div>
  </div>
</div>

<script>
  const SIZE_ORDER = ["S", "M", "L", "XL", "XXL"];

  // 社内サイズ表に基づく実寸(単位cm)。waistMin/waistMaxは隣接サイズと重なりがある
  const CHART = [
    { size: "S",   waistMin: 71, waistMax: 81, totalLength: 98,   hip: 104, inseam: 71.5 },
    { size: "M",   waistMin: 75, waistMax: 85, totalLength: 101.5, hip: 108, inseam: 74 },
    { size: "L",   waistMin: 79, waistMax: 89, totalLength: 105,  hip: 112, inseam: 76.5 },
    { size: "XL",  waistMin: 83, waistMax: 93, totalLength: 108.5, hip: 116, inseam: 79 },
    { size: "XXL", waistMin: 87, waistMax: 97, totalLength: 112,  hip: 120, inseam: 81.5 }
  ];

  // 範囲外(Sより下・XXLより上)は null を返す
  function neighborSize(size, delta) {
    const idx = SIZE_ORDER.indexOf(size) + delta;
    return idx >= 0 && idx < SIZE_ORDER.length ? SIZE_ORDER[idx] : null;
  }

  function rowBySize(size) {
    return CHART.find(r => r.size === size);
  }

  // ウエスト帯は隣接サイズと重なるため、中心値に最も近いサイズを標準推奨とする
  function sizeByWaist(waist) {
    let best = CHART[0];
    let bestDiff = Infinity;
    for (const row of CHART) {
      const center = (row.waistMin + row.waistMax) / 2;
      const diff = Math.abs(waist - center);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = row;
      }
    }
    return best;
  }

  function recommend() {
    const waist = parseFloat(document.getElementById("waist").value);
    const usual = document.getElementById("usual").value;

    if (!waist) {
      alert("ウエスト実寸を入力してください");
      return;
    }

    const row = sizeByWaist(waist);
    const primary = row.size;

    document.getElementById("mainSize").textContent = primary;

    let note = "";
    let altNote = "";

    if (waist < row.waistMin || waist > row.waistMax) {
      note = `ウエスト実寸(${waist}cm)は ${primary} の目安範囲(${row.waistMin}〜${row.waistMax}cm)からやや外れていますが、最も近いサイズとして ${primary} を推奨します。`;
    } else {
      note = `ウエスト実寸(${waist}cm)は ${primary} の目安範囲(${row.waistMin}〜${row.waistMax}cm)内です。`;
    }

    const fitChips = document.getElementById("fitChips");
    fitChips.innerHTML = "";
    fitChips.style.display = "none";

    if (usual) {
      if (usual === primary) {
        altNote = `普段 ${usual} を着用とのことで、判定と一致しています。`;
      } else {
        altNote = `普段 ${usual} を着用とのことで、当店の推奨(${primary})とは異なります。着方の好みに合わせて選べます。`;

        const tight = neighborSize(primary, -1);
        const over = neighborSize(primary, 1);
        const chips = [{ label: "スタンダード", size: primary, current: true }];
        if (tight) chips.push({ label: "タイト", size: tight });
        if (over) chips.push({ label: "オーバーサイズ", size: over });

        chips.forEach(c => {
          const el = document.createElement("div");
          el.className = "chip" + (c.current ? " chip-primary" : "");
          el.innerHTML = `<span class="chip-label">${c.label}</span><span class="chip-size">${c.size}</span>`;
          fitChips.appendChild(el);
        });
        fitChips.style.display = "flex";
      }
    }

    const spec = document.getElementById("specTable");
    spec.innerHTML = `
      <div class="k">総丈</div><div class="v">${row.totalLength}cm</div>
      <div class="k">ヒップ</div><div class="v">${row.hip}cm</div>
      <div class="k">股下</div><div class="v">${row.inseam}cm</div>
    `;

    document.getElementById("note").textContent = note;
    document.getElementById("altNote").textContent = altNote;
    document.getElementById("result").classList.add("show");
  }
</script>
</body>
</html>
